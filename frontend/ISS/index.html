<!doctype html>
<html lang="en" style="background-color: #020617; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/app_icon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hajji Mohammad Nabi Autos</title>
    <style>
      html, body {
        background-color: #020617 !important;
        margin: 0;
        padding: 0;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow-x: hidden;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #020617;
        z-index: 99999;
      }
      .loader-spinner {
        width: 42px;
        height: 42px;
        border: 4px solid #1e293b;
        border-top: 4px solid #3b82f6;
        border-radius: 50%;
        animation: loader-spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes loader-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body style="background-color: #020617;">
    <div id="root">
      <div id="initial-loader">
        <div class="loader-spinner"></div>
        <div style="font-size: 16px; font-weight: 700; color: #ffffff; letter-spacing: 0.5px;">Hajji Mohammad Nabi Autos</div>
        <div style="font-size: 12px; color: #64748b; margin-top: 4px;">Loading System...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
